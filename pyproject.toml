[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "orcaflow"
version = "2.0.0"
description = "CRM local para autônomos: clientes, orçamentos, propostas e próximos contatos"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["Flask>=3.1.3,<3.2", "waitress>=3.0.2,<4"]
authors = [{name = "Leonardo Santos"}]
license = "MIT"

[project.urls]
Repository = "https://github.com/LeoDevsn/orcaflow"
Issues = "https://github.com/LeoDevsn/orcaflow/issues"

[project.scripts]
orcaflow = "orca_flow.__main__:main"

[tool.setuptools.packages.find]
include = ["orca_flow*"]

[tool.setuptools.package-data]
orca_flow = ["frontend/*", "frontend/fonts/*"]
