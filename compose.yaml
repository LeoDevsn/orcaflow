services:
  orcaflow:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:7460:7460"
    volumes:
      - orcaflow-data:/data
    environment:
      ORCAFLOW_HTTPS: "1"
      ORCAFLOW_PROXY: "1"
      ORCAFLOW_PROXY_IP: "*"
      ORCAFLOW_TRUSTED_HOSTS: "localhost,127.0.0.1,orcaflow.example.com"
      TZ: America/Sao_Paulo
volumes:
  orcaflow-data:
